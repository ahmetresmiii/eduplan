<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlan - Hepsi Bir Arada Çalışma Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); }
        .sidebar-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-item.active { background: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
        .sidebar-item:not(.active):hover { background: #f1f5f9; color: #4f46e5; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .page-section { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen custom-scrollbar">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDAticRTzXdnFKzi4okPm1TIoqrf27QAuQ",
            authDomain: "appl-6eb7f.firebaseapp.com",
            projectId: "appl-6eb7f",
            storageBucket: "appl-6eb7f.firebasestorage.app",
            messagingSenderId: "1088954713905",
            appId: "1:1088954713905:web:81603ac97b6432e2add210",
            measurementId: "G-GXD89LBV63"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        window.state = {
            outcomes: [],
            activeTab: 'dashboard',
            timer: { minutes: 25, seconds: 0, isRunning: false, interval: null }
        };

        window.login = async () => {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="w-5 h-5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mr-2"></div> Bağlanıyor...';
            
            try {
                await setPersistence(auth, browserLocalPersistence);
                // Önce Popup dene, başarısız olursa Redirect'e geçecek
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Hatası:", error);
                // Timeout veya Popup bloklanma durumunda Redirect (Yönlendirme) yöntemini dene
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/network-request-failed' || error.code === 'auth/internal-error') {
                    showNotification("Yönlendirme moduna geçiliyor...", "info");
                    await signInWithRedirect(auth, provider);
                } else {
                    showNotification("Giriş başarısız: " + error.message, "error");
                    btn.disabled = false;
                    btn.innerHTML = `Google ile Giriş Yap`;
                }
            }
        };

        window.logout = () => signOut(auth);

        // Yönlendirme sonrası sonucu kontrol et
        getRedirectResult(auth).catch((error) => {
            if(error) showNotification("Yönlendirme hatası: " + error.message, "error");
        });

        onAuthStateChanged(auth, (user) => {
            const authScreen = document.getElementById('auth-screen');
            const mainApp = document.getElementById('main-app');
            if (user) {
                window.currentUser = user;
                authScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-email').innerText = user.email;
                loadUserData();
            } else {
                window.currentUser = null;
                authScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        async function loadUserData() {
            if (!window.currentUser) return;
            const q = query(collection(db, `users/${window.currentUser.uid}/outcomes`), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                window.state.outcomes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderOutcomes();
                updateDashboardStats();
            });
        }

        window.addOutcome = async (e) => {
            e.preventDefault();
            const lesson = document.getElementById('outcome-lesson').value;
            const content = document.getElementById('outcome-content').value;
            if(!content || !window.currentUser) return;
            try {
                await addDoc(collection(db, `users/${window.currentUser.uid}/outcomes`), {
                    lesson, content, completed: false, createdAt: new Date().toISOString()
                });
                document.getElementById('outcome-content').value = "";
                showNotification("Kazanım eklendi.");
            } catch (err) { showNotification("Hata: " + err.message, "error"); }
        };

        window.toggleOutcome = async (id, currentStatus) => {
            const docRef = doc(db, `users/${window.currentUser.uid}/outcomes`, id);
            await updateDoc(docRef, { completed: !currentStatus });
        };

        window.deleteOutcome = async (id) => {
            await deleteDoc(doc(db, `users/${window.currentUser.uid}/outcomes`, id));
            showNotification("Kazanım silindi.");
        };

        window.switchTab = (tabId) => {
            window.state.activeTab = tabId;
            document.querySelectorAll('.page-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.toggle('active', item.dataset.tab === tabId));
            if (window.lucide) window.lucide.createIcons();
        };

        window.updateTimerUI = () => {
            const t = window.state.timer;
            document.getElementById('timer-display').innerText = `${String(t.minutes).padStart(2, '0')}:${String(t.seconds).padStart(2, '0')}`;
            document.getElementById('timer-btn-text').innerText = t.isRunning ? 'Durdur' : 'Başlat';
        };

        window.toggleTimer = () => {
            const t = window.state.timer;
            if (t.isRunning) { clearInterval(t.interval); t.isRunning = false; }
            else {
                t.isRunning = true;
                t.interval = setInterval(() => {
                    if (t.seconds === 0) {
                        if (t.minutes === 0) { clearInterval(t.interval); t.isRunning = false; showNotification("Süre doldu!"); }
                        else { t.minutes--; t.seconds = 59; }
                    } else { t.seconds--; }
                    window.updateTimerUI();
                }, 1000);
            }
            window.updateTimerUI();
        };

        window.resetTimer = () => {
            clearInterval(window.state.timer.interval);
            window.state.timer = { minutes: 25, seconds: 0, isRunning: false, interval: null };
            window.updateTimerUI();
        };

        function renderOutcomes() {
            const list = document.getElementById('outcomes-list');
            if(!list) return;
            if (!window.state.outcomes.length) {
                list.innerHTML = `<div class="text-center py-12 bg-white rounded-3xl border-2 border-dashed border-slate-100"><p class="text-slate-400 font-medium">Henüz bir kazanım yok.</p></div>`;
                return;
            }
            list.innerHTML = window.state.outcomes.map(o => `
                <div class="flex items-center justify-between p-5 bg-white border border-slate-100 rounded-2xl mb-4 shadow-sm hover:shadow-md transition-all group">
                    <div class="flex items-center gap-4 flex-1">
                        <input type="checkbox" ${o.completed ? 'checked' : ''} onchange="toggleOutcome('${o.id}', ${o.completed})" class="w-6 h-6 rounded-lg border-2 border-slate-200 text-indigo-600 cursor-pointer">
                        <div>
                            <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-50 text-indigo-600 uppercase mb-1">${o.lesson}</span>
                            <p class="${o.completed ? 'line-through text-slate-400' : 'text-slate-700'} font-semibold">${o.content}</p>
                        </div>
                    </div>
                    <button onclick="deleteOutcome('${o.id}')" class="text-slate-300 hover:text-red-500 p-2 opacity-0 group-hover:opacity-100 transition-all">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            `).join('');
            if (window.lucide) window.lucide.createIcons();
        }

        function updateDashboardStats() {
            const total = window.state.outcomes.length;
            const completed = window.state.outcomes.filter(o => o.completed).length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-percent').innerText = `%${percent}`;
            document.getElementById('progress-bar-fill').style.width = `${percent}%`;
        }

        window.downloadPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const missing = window.state.outcomes.filter(o => !o.completed);
            if (!missing.length) return showNotification("Eksik kazanım yok!", "info");
            doc.text("EduPlan Eksik Kazanımlar Raporu", 14, 25);
            doc.autoTable({
                startY: 35,
                head: [['Ders', 'Kazanım Detayı']],
                body: missing.map(o => [o.lesson, o.content]),
                headStyles: { fillColor: [79, 70, 229] }
            });
            doc.save(`Eksik_Kazanımlar_${new Date().toLocaleDateString()}.pdf`);
        };

        function showNotification(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-2xl text-white z-[100] flex items-center gap-3 transition-all duration-500 ${type === 'success' ? 'bg-indigo-600' : type === 'info' ? 'bg-blue-500' : 'bg-red-500'}`;
            toast.innerHTML = `<span class="font-bold">${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 500); }, 3000);
        }

        window.addEventListener('load', () => { if (window.lucide) window.lucide.createIcons(); window.updateTimerUI(); });
    </script>

    <div id="auth-screen" class="flex items-center justify-center min-h-screen p-6 bg-slate-50">
        <div class="max-w-md w-full glass-card p-12 rounded-[3rem] shadow-2xl text-center">
            <div class="w-24 h-24 mx-auto mb-8 bg-gradient-to-br from-indigo-600 to-blue-700 rounded-[2rem] flex items-center justify-center shadow-xl">
                <i data-lucide="graduation-cap" class="w-12 h-12 text-white"></i>
            </div>
            <h1 class="text-4xl font-black text-slate-800 mb-2">Edu<span class="text-indigo-600">Plan</span></h1>
            <p class="text-slate-500 mb-10">Lütfen Google ile giriş yapın.</p>
            <button id="login-btn" onclick="login()" class="w-full flex items-center justify-center gap-4 bg-white border-2 border-slate-100 p-5 rounded-2xl hover:border-indigo-200 transition-all font-bold">
                <svg class="w-6 h-6" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"></path><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"></path><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2.1 1.5-4.6 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"></path><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"></path></svg>
                Google ile Giriş Yap
            </button>
        </div>
    </div>

    <div id="main-app" class="hidden flex flex-col lg:flex-row min-h-screen">
        <aside class="w-full lg:w-80 bg-white border-r border-slate-100 flex flex-col h-screen sticky top-0">
            <div class="p-10 flex items-center gap-4">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><i data-lucide="graduation-cap"></i></div>
                <span class="font-black text-2xl">Edu<span class="text-indigo-600">Plan</span></span>
            </div>
            <nav class="flex-1 px-6 space-y-2">
                <button onclick="switchTab('dashboard')" data-tab="dashboard" class="sidebar-item active w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold"><i data-lucide="layout-dashboard"></i> Genel Bakış</button>
                <button onclick="switchTab('outcomes')" data-tab="outcomes" class="sidebar-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold"><i data-lucide="list-checks"></i> Kazanımlar</button>
                <button onclick="switchTab('timer')" data-tab="timer" class="sidebar-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold"><i data-lucide="clock"></i> Pomodoro</button>
            </nav>
            <div class="p-8 border-t">
                <p id="user-name" class="text-sm font-black truncate"></p>
                <button onclick="logout()" class="w-full mt-4 py-3 text-red-500 hover:bg-red-50 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Çıkış
                </button>
            </div>
        </aside>

        <main class="flex-1 p-8 lg:p-14 max-w-6xl mx-auto w-full">
            <section id="section-dashboard" class="page-section space-y-10">
                <h2 class="text-4xl font-black text-slate-800">Hoş Geldin! 👋</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Toplam Kazanım</p>
                        <p id="stat-total" class="text-6xl font-black">0</p>
                    </div>
                    <div class="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Başarı Oranı</p>
                        <p id="stat-percent" class="text-6xl font-black text-emerald-500">%0</p>
                    </div>
                </div>
                <div class="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm">
                    <div class="flex justify-between mb-4"><h3 class="font-bold">İlerleme Durumu</h3></div>
                    <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden">
                        <div id="progress-bar-fill" class="bg-indigo-600 h-full w-0 transition-all duration-1000"></div>
                    </div>
                </div>
            </section>

            <section id="section-outcomes" class="page-section hidden space-y-8">
                <div class="flex justify-between items-center">
                    <h2 class="text-4xl font-black text-slate-800">Kazanım Takibi</h2>
                    <button onclick="downloadPDF()" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2">
                        <i data-lucide="file-down"></i> PDF İndir
                    </button>
                </div>
                <form onsubmit="addOutcome(event)" class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col md:flex-row gap-4">
                    <select id="outcome-lesson" class="bg-slate-50 p-4 rounded-xl font-bold border-none ring-1 ring-slate-200 outline-none">
                        <option>Matematik</option><option>Türkçe</option><option>Fen</option><option>Sosyal</option><option>İngilizce</option>
                    </select>
                    <input id="outcome-content" type="text" placeholder="Kazanım açıklaması..." class="flex-1 bg-slate-50 p-4 rounded-xl font-bold border-none ring-1 ring-slate-200 outline-none">
                    <button type="submit" class="bg-indigo-600 text-white px-8 py-4 rounded-xl font-bold hover:bg-indigo-700 transition-all">Ekle</button>
                </form>
                <div id="outcomes-list"></div>
            </section>

            <section id="section-timer" class="page-section hidden text-center space-y-12 py-10">
                <h2 class="text-5xl font-black text-slate-800">Odaklanma</h2>
                <div class="w-72 h-72 mx-auto rounded-full border-[12px] border-indigo-50 bg-white shadow-2xl flex flex-col items-center justify-center">
                    <div id="timer-display" class="text-6xl font-black text-indigo-600">25:00</div>
                </div>
                <div class="flex justify-center gap-6">
                    <button onclick="toggleTimer()" class="bg-indigo-600 text-white px-12 py-5 rounded-2xl font-black shadow-lg"><span id="timer-btn-text">Başlat</span></button>
                    <button onclick="resetTimer()" class="bg-white border-2 border-slate-100 px-10 py-5 rounded-2xl font-black text-slate-400">Sıfırla</button>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
