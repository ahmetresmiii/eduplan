    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDAticRTzXdnFKzi4okPm1TIoqrf27QAuQ",
            authDomain: "appl-6eb7f.firebaseapp.com",
            projectId: "appl-6eb7f",
            storageBucket: "appl-6eb7f.firebasestorage.app",
            messagingSenderId: "1088954713905",
            appId: "1:1088954713905:web:81603ac97b6432e2add210"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let userOutcomes = [];
        let currentUser = null;

        // Auth İşlemleri
        window.handleGoogleLogin = async () => {
            try {
                const res = await signInWithPopup(auth, provider);
            } catch (err) {
                console.error(err);
                showAuthError("Google bağlantısı başarısız. Lütfen tekrar deneyin veya e-posta kullanın.");
            }
        };

        window.handleEmailLogin = async () => {
            const email = document.getElementById('email-input').value;
            const pass = document.getElementById('password-input').value;
            if(!email || !pass) return showAuthError("Lütfen alanları doldurun.");
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                showAuthError("Giriş yapılamadı: " + translateError(err.code));
            }
        };

        window.handleEmailSignUp = async () => {
            const email = document.getElementById('email-input').value;
            const pass = document.getElementById('password-input').value;
            if(!email || pass.length < 6) return showAuthError("E-posta geçerli, şifre en az 6 karakter olmalıdır.");
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                showAuthError("Kayıt olunamadı: " + translateError(err.code));
            }
        };

        function translateError(code) {
            switch(code) {
                case 'auth/invalid-credential': return "Hatalı e-posta veya şifre.";
                case 'auth/email-already-in-use': return "Bu e-posta zaten kullanımda.";
                case 'auth/weak-password': return "Şifre çok zayıf.";
                default: return "Bir hata oluştu.";
            }
        }

        function showAuthError(msg) {
            const err = document.getElementById('auth-error');
            err.innerText = msg;
            err.classList.remove('hidden');
        }

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('user-avatar').innerText = (user.displayName || user.email).charAt(0);
                loadData();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        // Veri Yükleme
        function loadData() {
            const q = query(
                collection(db, "outcomes"), 
                where("userId", "==", currentUser.uid)
            );
            
            onSnapshot(q, (snapshot) => {
                userOutcomes = [];
                snapshot.forEach(doc => userOutcomes.push({ id: doc.id, ...doc.data() }));
                renderOutcomes();
            });
        }

        window.addOutcome = async () => {
            const subject = document.getElementById('outcome-subject').value;
            const text = document.getElementById('outcome-text').value;
            if (!text) return;
            
            await addDoc(collection(db, "outcomes"), {
                userId: currentUser.uid,
                subject,
                text,
                status: 'eksik',
                createdAt: Date.now()
            });
            document.getElementById('outcome-text').value = '';
        };

        window.deleteOutcome = async (id) => {
            await deleteDoc(doc(db, "outcomes", id));
        };

        window.toggleOutcomeStatus = async (id, currentStatus) => {
            const nextStatus = currentStatus === 'eksik' ? 'tamamlandi' : 'eksik';
            await updateDoc(doc(db, "outcomes", id), { status: nextStatus });
        };

        function renderOutcomes() {
            const container = document.getElementById('outcomes-list');
            container.innerHTML = '';
            
            userOutcomes.sort((a, b) => b.createdAt - a.createdAt).forEach(item => {
                const isDone = item.status === 'tamamlandi';
                const card = `
                    <div class="glass p-5 rounded-2xl border-l-4 ${isDone ? 'border-green-500 opacity-60' : 'border-indigo-500'} transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold px-2 py-1 bg-slate-100 rounded-md text-slate-600">${item.subject}</span>
                            <button onclick="deleteOutcome('${item.id}')" class="text-slate-300 hover:text-red-500">✕</button>
                        </div>
                        <p class="text-slate-700 font-medium mb-4 ${isDone ? 'line-through' : ''}">${item.text}</p>
                        <button onclick="toggleOutcomeStatus('${item.id}', '${item.status}')" class="w-full py-2 rounded-lg text-sm font-semibold ${isDone ? 'bg-green-50 text-green-600' : 'bg-indigo-50 text-indigo-600'} hover:opacity-80">
                            ${isDone ? '✓ Tamamlandı' : 'Tamamla'}
                        </button>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // PDF İndirme (UTF-8 Font Desteği için Standard Fontlar Kullanılır)
        window.downloadOutcomesPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Başlık
            doc.setFontSize(20);
            doc.text("EduPlan - Eksik Kazanim Listesi", 14, 22);
            
            const rows = userOutcomes
                .filter(i => i.status === 'eksik')
                .map(i => [i.subject, i.text]);

            doc.autoTable({
                startY: 30,
                head: [['Ders', 'Kazanim']],
                body: rows,
                theme: 'striped',
                styles: { font: "helvetica", fontSize: 10 },
                headStyles: { fillColor: [99, 102, 241] }
            });

            doc.save("EduPlan_Eksik_Kazanımlar.pdf");
        };

        // Navigation
        window.showPage = (page) => {
            document.querySelectorAll('.page-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`page-${page}`).classList.remove('hidden');
            
            // Sidebar aktif link rengi
            document.querySelectorAll('aside nav button').forEach(b => {
                b.classList.remove('text-indigo-600', 'bg-indigo-50');
                b.classList.add('text-slate-600');
            });
            event.currentTarget.classList.add('text-indigo-600', 'bg-indigo-50');
        };

        // Timer
        let timer;
        let timeLeft = 25 * 60;
        let isRunning = false;

        window.toggleTimer = () => {
            const btn = document.getElementById('timer-btn');
            if (isRunning) {
                clearInterval(timer);
                btn.innerText = "Başlat";
                btn.classList.replace('bg-red-500', 'bg-indigo-600');
            } else {
                timer = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        alert("Süre bitti! Harika iş çıkardın.");
                        resetTimer();
                    }
                }, 1000);
                btn.innerText = "Durdur";
                btn.classList.replace('bg-indigo-600', 'bg-red-500');
            }
            isRunning = !isRunning;
        };

        window.resetTimer = () => {
            clearInterval(timer);
            isRunning = false;
            timeLeft = 25 * 60;
            updateTimerDisplay();
            const btn = document.getElementById('timer-btn');
            btn.innerText = "Başlat";
            btn.classList.remove('bg-red-500');
            btn.classList.add('bg-indigo-600');
        };

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // Haftalık Program Oluşturucu
        function initSchedule() {
            const tbody = document.getElementById('schedule-body');
            const hours = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00"];
            hours.forEach(hour => {
                let row = `<tr class="border-b border-slate-100">
                    <td class="p-4 font-semibold text-slate-400 text-sm">${hour}</td>
                    <td class="p-4"><input class="w-full bg-transparent outline-none text-sm" placeholder="..."></td>
                    <td class="p-4"><input class="w-full bg-transparent outline-none text-sm" placeholder="..."></td>
                    <td class="p-4"><input class="w-full bg-transparent outline-none text-sm" placeholder="..."></td>
                    <td class="p-4"><input class="w-full bg-transparent outline-none text-sm" placeholder="..."></td>
                    <td class="p-4"><input class="w-full bg-transparent outline-none text-sm" placeholder="..."></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }
        initSchedule();

    </script>
</body>
</html>
