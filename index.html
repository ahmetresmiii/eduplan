<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlan - Hepsi Bir Arada Çalışma Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .sidebar-item.active { background-color: #4f46e5; color: white; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        .timer-animate { animation: pulse-slow 2s infinite; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .page-section.hidden { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen custom-scrollbar">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Değişken Tanımlamaları
        const firebaseConfig = {
            apiKey: "AIzaSyDAticRTzXdnFKzi4okPm1TIoqrf27QAuQ",
            authDomain: "appl-6eb7f.firebaseapp.com",
            projectId: "appl-6eb7f",
            storageBucket: "appl-6eb7f.firebasestorage.app",
            messagingSenderId: "1088954713905",
            appId: "1:1088954713905:web:81603ac97b6432e2add210",
            measurementId: "G-GXD89LBV63"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Global Değişkenler
        window.currentUser = null;
        window.appId = "eduplan_pro_v1";
        window.state = {
            outcomes: [],
            activeTab: 'dashboard',
            timer: {
                minutes: 25,
                seconds: 0,
                isRunning: false,
                interval: null
            }
        };

        window.login = async () => {
            const btn = document.getElementById('login-btn');
            try {
                btn.disabled = true;
                btn.innerHTML = '<span class="animate-spin mr-2">⏳</span> Bağlanıyor...';
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login hatası:", error);
                btn.disabled = false;
                btn.innerHTML = 'Google ile Giriş Yap';
                showNotification("Giriş başarısız: " + error.message, "error");
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            window.currentUser = user;
            const authScreen = document.getElementById('auth-screen');
            const mainApp = document.getElementById('main-app');

            if (user) {
                authScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-email').innerText = user.email;
                loadUserData();
            } else {
                authScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        async function loadUserData() {
            if (!window.currentUser) return;
            const userId = window.currentUser.uid;
            const outcomesPath = `users/${userId}/outcomes`;

            onSnapshot(collection(db, outcomesPath), (snapshot) => {
                window.state.outcomes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderOutcomes();
                updateDashboardStats();
            }, (err) => {
                console.error("Veri çekme hatası:", err);
            });
        }

        window.addOutcome = async (e) => {
            e.preventDefault();
            const lesson = document.getElementById('outcome-lesson').value;
            const content = document.getElementById('outcome-content').value;
            
            if(!lesson || !content || !window.currentUser) return;

            try {
                const userId = window.currentUser.uid;
                await addDoc(collection(db, `users/${userId}/outcomes`), {
                    lesson,
                    content,
                    completed: false,
                    createdAt: new Date().toISOString()
                });
                document.getElementById('outcome-content').value = "";
                showNotification("Kazanım eklendi.");
            } catch (err) {
                showNotification("Hata oluştu!", "error");
            }
        };

        window.toggleOutcome = async (id, currentStatus) => {
            if (!window.currentUser) return;
            const userId = window.currentUser.uid;
            const docRef = doc(db, `users/${userId}/outcomes`, id);
            await updateDoc(docRef, { completed: !currentStatus });
        };

        window.deleteOutcome = async (id) => {
            if (!window.currentUser) return;
            const userId = window.currentUser.uid;
            await deleteDoc(doc(db, `users/${userId}/outcomes`, id));
            showNotification("Kazanım silindi.");
        };

        window.updateTimerUI = () => {
            const timerObj = window.state.timer;
            if (!timerObj) return;
            const min = String(timerObj.minutes).padStart(2, '0');
            const sec = String(timerObj.seconds).padStart(2, '0');
            const display = document.getElementById('timer-display');
            const btnText = document.getElementById('timer-btn-text');
            
            if(display) display.innerText = `${min}:${sec}`;
            if(btnText) btnText.innerText = timerObj.isRunning ? 'Durdur' : 'Başlat';
        };

        window.toggleTimer = () => {
            if (window.state.timer.isRunning) {
                clearInterval(window.state.timer.interval);
                window.state.timer.isRunning = false;
            } else {
                window.state.timer.isRunning = true;
                window.state.timer.interval = setInterval(() => {
                    const t = window.state.timer;
                    if (t.seconds === 0) {
                        if (t.minutes === 0) {
                            clearInterval(t.interval);
                            t.isRunning = false;
                            completeSession();
                        } else {
                            t.minutes--;
                            t.seconds = 59;
                        }
                    } else {
                        t.seconds--;
                    }
                    window.updateTimerUI();
                }, 1000);
            }
            window.updateTimerUI();
        };

        window.resetTimer = () => {
            clearInterval(window.state.timer.interval);
            window.state.timer.isRunning = false;
            window.state.timer.minutes = 25;
            window.state.timer.seconds = 0;
            window.updateTimerUI();
        };

        function completeSession() {
            showNotification("Süre doldu! Harika bir çalışma.");
        }

        function renderOutcomes() {
            const list = document.getElementById('outcomes-list');
            if(!list) return;
            if (!window.state.outcomes.length) {
                list.innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border-2 border-dashed border-slate-100"><p class="text-slate-400">Henüz kazanım yok.</p></div>`;
                return;
            }
            list.innerHTML = window.state.outcomes.map(o => `
                <div class="flex items-center justify-between p-4 bg-white border border-slate-200 rounded-xl mb-3 shadow-sm">
                    <div class="flex items-center gap-4">
                        <input type="checkbox" ${o.completed ? 'checked' : ''} onchange="toggleOutcome('${o.id}', ${o.completed})" class="w-6 h-6 rounded-lg text-indigo-600 cursor-pointer">
                        <div>
                            <span class="text-[10px] font-bold text-indigo-600 uppercase tracking-widest">${o.lesson}</span>
                            <p class="${o.completed ? 'line-through text-slate-400' : 'text-slate-700'} font-medium">${o.content}</p>
                        </div>
                    </div>
                    <button onclick="deleteOutcome('${o.id}')" class="text-slate-300 hover:text-red-500 transition-colors p-2">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            `).join('');
            if (window.lucide) window.lucide.createIcons();
        }

        function updateDashboardStats() {
            const total = window.state.outcomes.length;
            const completed = window.state.outcomes.filter(o => o.completed).length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            const totalEl = document.getElementById('stat-total');
            const percentEl = document.getElementById('stat-percent');
            const progressEl = document.getElementById('progress-bar-fill');

            if(totalEl) totalEl.innerText = total;
            if(percentEl) percentEl.innerText = `%${percent}`;
            if(progressEl) progressEl.style.width = `${percent}%`;
        }

        window.switchTab = (tabId) => {
            window.state.activeTab = tabId;
            document.querySelectorAll('.page-section').forEach(s => s.classList.add('hidden'));
            const activeSection = document.getElementById(`section-${tabId}`);
            if(activeSection) activeSection.classList.remove('hidden');
            
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active');
                if(item.dataset.tab === tabId) item.classList.add('active');
            });
            if (window.lucide) window.lucide.createIcons();
        };

        window.downloadPDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const missingOutcomes = window.state.outcomes.filter(o => !o.completed);
            
            if (missingOutcomes.length === 0) {
                showNotification("Eksik kazanımınız yok!", "success");
                return;
            }

            doc.setFontSize(20);
            doc.text("EduPlan: Eksik Kazanimlar Raporu", 14, 22);
            doc.setFontSize(11);
            doc.text(`Tarih: ${new Date().toLocaleDateString('tr-TR')}`, 14, 30);

            const tableData = missingOutcomes.map(o => [o.lesson, o.content, 'Eksik']);
            doc.autoTable({
                startY: 40,
                head: [['Ders', 'Kazanim / Konu', 'Durum']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [79, 70, 229] }
            });
            doc.save("EduPlan_Eksik_Kazanimlar.pdf");
        };

        function showNotification(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-xl shadow-xl text-white z-50 transform transition-all duration-300 ${type === 'success' ? 'bg-emerald-500' : 'bg-red-500'}`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.addEventListener('load', () => {
            if (window.lucide) window.lucide.createIcons();
            window.updateTimerUI();
        });
    </script>

    <!-- UI STRUCTURE (Aynı Kaldı) -->
    <div id="auth-screen" class="flex items-center justify-center min-h-screen p-6 bg-gradient-to-br from-indigo-50 via-white to-slate-100">
        <div class="max-w-md w-full glass-card p-10 rounded-[2.5rem] shadow-2xl border border-white">
            <div class="text-center mb-10">
                <div class="w-24 h-24 mx-auto mb-8 relative group">
                    <div class="absolute inset-0 bg-indigo-600 rounded-3xl rotate-6 opacity-10"></div>
                    <div class="relative w-full h-full bg-indigo-600 rounded-3xl flex items-center justify-center shadow-2xl shadow-indigo-200">
                        <svg viewBox="0 0 100 100" class="w-14 h-14 text-white" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 70V30C20 24.4772 24.4772 20 30 20H70C75.5228 20 80 24.4772 80 30V70C80 75.5228 75.5228 80 70 80H30C24.4772 80 20 75.5228 20 70Z" fill="rgba(255,255,255,0.1)"/>
                            <path d="M30 45L50 35L70 45L50 55L30 45Z" fill="white" stroke="none"/>
                            <path d="M30 45V55C30 55 35 60 50 60C65 60 70 55 70 55V45" />
                            <path d="M50 35V25M70 45V55M80 45L85 60" stroke-width="4"/>
                        </svg>
                    </div>
                </div>
                <h1 class="text-4xl font-black text-slate-800 tracking-tight mb-2">Edu<span class="text-indigo-600">Plan</span></h1>
                <p class="text-slate-500 font-medium">Başarıya giden yol, iyi bir plandan geçer.</p>
            </div>
            
            <button id="login-btn" onclick="login()" class="w-full flex items-center justify-center gap-4 bg-white border border-slate-200 p-4 rounded-2xl hover:bg-slate-50 hover:border-indigo-200 transition-all shadow-sm font-semibold text-slate-700">
                <svg class="w-6 h-6" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
                </svg>
                Google ile Giriş Yap
            </button>
        </div>
    </div>

    <div id="main-app" class="hidden flex flex-col md:flex-row min-h-screen">
        <aside class="w-full md:w-72 bg-white border-r border-slate-200 flex flex-col sticky top-0 h-screen">
            <div class="p-8 flex items-center gap-4">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white">
                    <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                </div>
                <span class="font-black text-2xl text-slate-800">Edu<span class="text-indigo-600">Plan</span></span>
            </div>
            
            <nav class="flex-1 px-4 space-y-2">
                <button onclick="switchTab('dashboard')" data-tab="dashboard" class="sidebar-item active w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-semibold">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>Genel Bakış</span>
                </button>
                <button onclick="switchTab('outcomes')" data-tab="outcomes" class="sidebar-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-semibold">
                    <i data-lucide="list-checks" class="w-5 h-5"></i>
                    <span>Kazanım Takibi</span>
                </button>
                <button onclick="switchTab('timer')" data-tab="timer" class="sidebar-item w-full flex items-center gap-4 px-6 py-4 rounded-2xl transition-all font-semibold">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                    <span>Pomodoro</span>
                </button>
            </nav>

            <div class="p-6 border-t border-slate-100">
                <div class="bg-slate-50 p-4 rounded-2xl mb-4 flex items-center gap-3">
                    <div class="overflow-hidden">
                        <p id="user-name" class="text-sm font-bold text-slate-800 truncate"></p>
                        <p id="user-email" class="text-[10px] text-slate-400 truncate"></p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full py-3 text-red-500 hover:bg-red-50 rounded-xl transition-all text-sm font-bold">
                    Çıkış Yap
                </button>
            </div>
        </aside>

        <main class="flex-1 p-6 md:p-10 max-w-7xl mx-auto w-full">
            <!-- Sections (Aynı Yapı) -->
            <section id="section-dashboard" class="page-section space-y-8">
                <h2 class="text-3xl font-black text-slate-800">Hoş Geldin! 👋</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase mb-2">Toplam Kazanım</p>
                        <p id="stat-total" class="text-5xl font-black text-slate-800">0</p>
                    </div>
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase mb-2">Tamamlanma</p>
                        <p id="stat-percent" class="text-5xl font-black text-indigo-600">%0</p>
                    </div>
                </div>
                <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                    <h3 class="font-bold mb-4">Genel İlerleme</h3>
                    <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden">
                        <div id="progress-bar-fill" class="bg-indigo-600 h-full w-0 transition-all duration-1000"></div>
                    </div>
                </div>
            </section>

            <section id="section-outcomes" class="page-section hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black text-slate-800">Kazanım Yönetimi</h2>
                    <button onclick="downloadPDF()" class="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold">PDF İndir</button>
                </div>
                <form onsubmit="addOutcome(event)" class="bg-white p-6 rounded-2xl border border-slate-100 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <select id="outcome-lesson" class="bg-slate-50 p-4 rounded-xl font-bold">
                        <option value="Matematik">Matematik</option>
                        <option value="Türkçe">Türkçe</option>
                        <option value="Fen Bilimleri">Fen Bilimleri</option>
                    </select>
                    <input id="outcome-content" type="text" placeholder="Kazanım adı..." class="bg-slate-50 p-4 rounded-xl font-bold">
                    <button type="submit" class="bg-indigo-600 text-white rounded-xl font-bold">Ekle</button>
                </form>
                <div id="outcomes-list" class="space-y-3"></div>
            </section>

            <section id="section-timer" class="page-section hidden text-center space-y-12 py-12">
                <h2 class="text-4xl font-black text-slate-800">Odaklanma Zamanı</h2>
                <div class="w-64 h-64 mx-auto flex items-center justify-center rounded-full border-[12px] border-indigo-50 bg-white">
                    <div id="timer-display" class="text-6xl font-mono font-black text-indigo-600">25:00</div>
                </div>
                <div class="flex justify-center gap-4">
                    <button onclick="toggleTimer()" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-black text-xl shadow-lg">
                        <span id="timer-btn-text">Başlat</span>
                    </button>
                    <button onclick="resetTimer()" class="bg-white border border-slate-200 px-8 py-4 rounded-2xl font-bold">Sıfırla</button>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
